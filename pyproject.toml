[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lark-streaming"
version = "1.4.0"
description = "Real-time streaming card plugin for Hermes Gateway via Feishu/Lark CardKit v2.0"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wzgrx" }]
keywords = ["Hermes", "Feishu", "Lark", "CardKit", "streaming-card"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "lark-oapi>=1.6.8",
  "PyYAML>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/wzgrx/hermes-lark-streaming"
Changelog = "https://github.com/wzgrx/hermes-lark-streaming/blob/main/CHANGELOG.md"

[project.scripts]
hermes-lark-streaming = "hermes_lark_streaming.__main__:main"

[project.entry-points."hermes_agent.plugins"]
hermes-lark-streaming = "hermes_lark_streaming"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.10",
  "mypy>=2.3.1",
  "types-PyYAML>=6.0.12.20260906",
]

[tool.setuptools.package-data]
"hermes_lark_streaming.details" = ["account_catalog.json"]

[tool.setuptools.packages.find]
include = ["hermes_lark_streaming*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003", "RUF006"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
