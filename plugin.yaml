name: hermes-lark-streaming
version: 0.20.8
description: "Feishu/Lark CardKit streaming integration for Hermes Gateway"
author: "wzgrx"
kind: standalone
provides_middleware:
  - llm_execution
provides_hooks:
  - on_stream_start
  - on_stream_delta
  - on_stream_end
  - on_interim_message
  - post_tool_call
  - agent_loop_stopped
  - pre_approval_request
  - post_approval_response
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_auxiliary_call
  - post_auxiliary_call
