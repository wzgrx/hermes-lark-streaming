name: Hermes Compat Check

on:
  schedule:
    - cron: '0 0 * * *'  # daily at 08:00 CST
  push:
    paths:
      - 'hermes_lark_streaming/patcher.py'
      - 'hermes_lark_streaming/modular_patcher.py'
      - '.github/workflows/hermes-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest Hermes source
        uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          path: _hermes-agent
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install plugin
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify latest modular Hermes
        id: verify
        continue-on-error: true
        run: |
          set +e
          python - <<'PY' > /tmp/verify.log 2>&1
          from pathlib import Path
          from hermes_lark_streaming.patcher import CronPatcher, Patcher

          root = Path('_hermes-agent')
          Patcher(root / 'gateway/run.py').verify_target()
          CronPatcher(root / 'cron/scheduler.py').verify_target()
          print('Gateway and cron targets are compatible with latest Hermes main.')
          PY
          code=$?
          {
            echo "exit=${code}"
            echo 'log<<VERIFY_EOF'
            cat /tmp/verify.log
            echo 'VERIFY_EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Open issue on compatibility failure
        if: always() && steps.verify.outcome != 'success'
        uses: actions/github-script@v7
        env:
          VERIFY_LOG: ${{ steps.verify.outputs.log }}
        with:
          script: |
            const label = 'hermes-compat';
            const title = 'Hermes main compatibility check failed';
            const log = process.env.VERIFY_LOG || '(no output captured)';
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `The daily check against the latest modular Hermes source failed.\n\nInspect injection anchors under \`gateway/run_*.py\` and \`cron/scheduler_delivery.py\`.\n\n<details><summary>verify output</summary>\n\n\`\`\`\n${log}\n\`\`\`\n\n</details>\n\nWorkflow run: ${run}`;
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'e99695',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Fail job on compatibility break
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
