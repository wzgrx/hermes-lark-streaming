name: Hermes Compat Check

on:
  schedule:
    - cron: '0 0 * * *'  # daily at 08:00 CST
  push:
    paths:
      - 'hermes_lark_streaming/patcher.py'
      - 'hermes_lark_streaming/modular_patcher.py'
      - '.github/workflows/hermes-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch latest Hermes source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NousResearch/hermes-agent
          path: _hermes-agent
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install plugin
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify latest modular Hermes
        id: verify
        continue-on-error: true
        run: |
          python - <<'PY' > "$RUNNER_TEMP/hermes-compat-verify.log" 2>&1
          from pathlib import Path
          from hermes_lark_streaming.patcher import CronPatcher, Patcher

          root = Path('_hermes-agent')
          Patcher(root / 'gateway/run.py').verify_target()
          CronPatcher(root / 'cron/scheduler.py').verify_target()
          print('Gateway and cron targets are compatible with latest Hermes main.')
          PY

      - name: Summarize compatibility failure
        if: always() && steps.verify.outcome == 'failure'
        run: |
          echo '::error title=Hermes main compatibility check failed::Inspect Gateway and cron injection anchors.'
          {
            echo '## Hermes main compatibility check failed'
            echo ''
            echo 'Inspect injection anchors under `gateway/run_*.py` and `cron/scheduler_delivery.py`.'
            echo ''
            echo '```text'
            if [ -f "$RUNNER_TEMP/hermes-compat-verify.log" ]; then cat "$RUNNER_TEMP/hermes-compat-verify.log"; else echo '(verify log unavailable)'; fi
            echo '```'
            echo ''
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/hermes-compat-verify.log" ]; then cat "$RUNNER_TEMP/hermes-compat-verify.log"; fi
      - name: Fail job on compatibility break
        if: always() && steps.verify.outcome == 'failure'
        run: exit 1
