name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest Hermes source
        uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          path: _hermes-agent
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check hermes_lark_streaming tests

      - name: Run mypy
        run: python -m mypy hermes_lark_streaming

      - name: Run tests against latest Hermes
        env:
          HERMES_MODULAR_SOURCE: ${{ github.workspace }}/_hermes-agent
        run: python -m pytest tests -q
