<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-label="Hermes Card runtime architecture"><title>Hermes Card runtime architecture</title><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#f4f7fc"/><text x="40" y="55" font-size="29" fill="#18273e" font-weight="700">HERMES / LARK STREAMING</text><text x="40" y="88" font-size="19" fill="#536781" font-weight="400">Native cards + per-turn telemetry + local usage history</text><rect x="40" y="125" width="320" height="132" rx="12" fill="white" stroke="#d5e0ec"/><text x="62" y="161" font-size="23" fill="#2464d2" font-weight="700">Hermes</text><text x="62" y="200" font-size="18" fill="#18273e" font-weight="400">Model / provider / tools</text><text x="62" y="228" font-size="18" fill="#18273e" font-weight="400">Public lifecycle hooks</text><rect x="400" y="125" width="320" height="132" rx="12" fill="white" stroke="#d5e0ec"/><text x="422" y="161" font-size="23" fill="#2464d2" font-weight="700">Card plugin</text><text x="422" y="200" font-size="18" fill="#18273e" font-weight="400">One delivery owner</text><text x="422" y="228" font-size="18" fill="#18273e" font-weight="400">Streaming + Footer V2</text><rect x="760" y="125" width="320" height="132" rx="12" fill="white" stroke="#d5e0ec"/><text x="782" y="161" font-size="23" fill="#2464d2" font-weight="700">Feishu client</text><text x="782" y="200" font-size="18" fill="#18273e" font-weight="400">Card JSON 2.0</text><text x="782" y="228" font-size="18" fill="#18273e" font-weight="400">Native layout / interaction</text><text x="366" y="202" font-size="28" fill="#2464d2" font-weight="400">→</text><text x="726" y="202" font-size="28" fill="#2464d2" font-weight="400">→</text><rect x="400" y="291" width="320" height="110" rx="12" fill="#edf3ff" stroke="#d5e0ec"/><text x="423" y="326" font-size="22" fill="#2464d2" font-weight="700">Local SQLite ledger</text><text x="423" y="360" font-size="18" fill="#18273e" font-weight="400">Month / provider / model</text><text x="423" y="387" font-size="16" fill="#18273e" font-weight="400">CLI + JSON • no account polling</text><text x="551" y="286" font-size="24" fill="#2464d2" font-weight="400">↓</text><text x="40" y="453" font-size="18" fill="#18273e" font-weight="400">SDK / CLI send data. The client renders it. Concept art is not runtime proof.</text></svg>
